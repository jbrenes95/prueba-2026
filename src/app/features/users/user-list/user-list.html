<mat-toolbar class="page-toolbar">
  <span>Usuarios</span>
</mat-toolbar>

<div class="container py-4">
  @if (usersService.loading()) {
    <div class="d-flex justify-content-center py-5">
      <mat-spinner />
    </div>
  }

  @if (usersService.error()) {
    <p class="text-danger">{{ usersService.error() }}</p>
  }

  @if (!usersService.loading() && !usersService.error()) {
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar</mat-label>
      <input matInput [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-card class="table-card">
      <mat-card-content class="table-wrapper">
        <table mat-table [dataSource]="filteredUsers()" class="w-100">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let user">{{ user.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let user">{{ user.name }}</td>
          </ng-container>

          <ng-container matColumnDef="surname">
            <th mat-header-cell *matHeaderCellDef>Apellido</th>
            <td mat-cell *matCellDef="let user">{{ user.surname }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="cursor-pointer"
            (click)="goToDetail(row.id)"
          ></tr>
        </table>
      </mat-card-content>
    </mat-card>
  }
</div>
